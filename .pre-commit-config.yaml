# Local hooks only: every tool runs via `uv run`, so versions come from the
# committed uv.lock (doc 23 supply-chain rule) and hooks work offline.
# CI runs the same tools directly — keep the two in lockstep.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: uv\.lock
      - id: lint-imports
        name: import-linter (layer rule)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml)
      - id: pytest-fast
        name: pytest fast loop (tests/unit)
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
