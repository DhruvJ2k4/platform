[project]
name = "platform"
version = "0.1.0"
description = "Single-operator quantitative research and portfolio platform for NSE equities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.0",  # already resolved via pandas/pyarrow; declared for curate/universe.py's direct use
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "structlog>=26.1.0",
    "typer>=0.26.8",
]

[project.scripts]
platform = "quant.cli:app"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "hypothesis>=6.156.6",
    "import-linter>=2.13",
    "mypy>=2.2.0",
    "pandera>=0.32.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution stays "platform"; the import package is "quant" (ADR-020:
# stdlib `platform` shadows any same-named package).
module-name = "quant"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# D100/D104 enforce doc 23's "every module docstring states its contract".
# No pydocstyle convention is set: a convention would disable these
# individually selected D rules.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D104"]
# prices_adj mirrors doc-10 column names verbatim, including "l" (low).
"src/quant/schemas/curated.py" = ["E741"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# --strict runs on the money paths (engine/ledger/evaluation) via the explicit
# command in CLAUDE.md and CI; mypy has no per-module strict override.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_packages = ["quant"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layer rule (doc 23): ingest -> curate -> features -> engine -> drivers -> reports"
type = "layers"
layers = [
    "quant.cli",
    "quant.ops",
    "quant.agents",
    "quant.evaluation",
    "quant.reports",
    "quant.drivers",
    "quant.ledger",
    "quant.engine",
    "quant.features",
    "quant.curate",
    "quant.ingest",
    "quant.config",
    "quant.schemas",
    "quant.errors",
]

[[tool.importlinter.contracts]]
name = "Engine purity (ADR-016): engine never imports io/httpx/requests/duckdb"
type = "forbidden"
source_modules = ["quant.engine"]
forbidden_modules = ["io", "httpx", "requests", "duckdb"]
